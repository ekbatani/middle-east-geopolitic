[project]
name = "mei"
version = "0.1.0"
description = "Middle East Geopolitical Intelligence Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "playwright>=1.48",
    "beautifulsoup4>=4.12",
    "polars>=1.12",
    "networkx>=3.4",
    "rapidfuzz>=3.10",
    "dateparser>=1.2",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "pyyaml>=6.0",
    "openai>=1.50",
    "langdetect>=1.0.9",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers>=4.8",
    "hypothesis>=6.115",
]

[project.scripts]
mei = "apps.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mei", "apps"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mei"]

[tool.mypy]
python_version = "3.13"
mypy_path = ["src"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

module = [
    "trafilatura.*",
    "dateparser.*",
    "feedparser.*",
    "rapidfuzz.*",
    "testcontainers.*",
    "pgvector.*",
    "yaml.*",
    "langdetect.*",
    "networkx.*",
]
ignore_missing_imports = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/mei", "apps"]



[[tool.mypy.overrides]]
module = [
    "trafilatura.*",
    "dateparser.*",
    "feedparser.*",
    "rapidfuzz.*",
    "testcontainers.*",
    "pgvector.*",
    "yaml.*",
    "langdetect.*",
    "networkx.*",
]
ignore_missing_imports = true
