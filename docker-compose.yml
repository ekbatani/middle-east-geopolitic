services:
  postgres:
    image: pgvector/pgvector:pg16
    pull_policy: if_not_present
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mei}
      POSTGRES_DB: ${POSTGRES_DB:-mei}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mei}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
      pull: false
    pull_policy: build
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed.py && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://mei:mei@postgres:5432/mei}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      pull: false
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    pull_policy: build
    ports:
      - "3003:3003"
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api

volumes:
  postgres-data:
