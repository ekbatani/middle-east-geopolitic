services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mei}
      POSTGRES_DB: ${POSTGRES_DB:-mei}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mei}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: api
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed.py"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://mei:mei@postgres:5432/mei}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://mei:mei@postgres:5432/mei}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
