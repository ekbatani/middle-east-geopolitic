<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MEI — Event Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #map { position: absolute; top: 0; right: 0; bottom: 0; left: 320px; }
  #panel { position: absolute; top: 0; left: 0; bottom: 0; width: 320px; box-sizing: border-box;
           padding: 12px; overflow-y: auto; background: #fafafa; border-right: 1px solid #ddd; }
  #panel h1 { font-size: 16px; margin: 0 0 12px; }
  #panel label { display: block; font-size: 12px; margin: 10px 0 2px; color: #333; }
  #panel input, #panel select { width: 100%; box-sizing: border-box; padding: 4px; font-size: 13px; }
  #panel button { margin-top: 12px; width: 100%; padding: 6px; cursor: pointer; }
  #status { margin-top: 10px; font-size: 12px; color: #666; }
</style>
</head>
<body>
<div id="panel">
  <h1>MEI — Event Map</h1>

  <label for="token">API bearer token</label>
  <input id="token" type="password" placeholder="mei_... or JWT" />

  <label for="since">Since</label>
  <input id="since" type="date" />

  <label for="until">Until</label>
  <input id="until" type="date" />

  <label for="event_type">Event type</label>
  <input id="event_type" type="text" placeholder="e.g. missile_strike" />

  <label for="min_severity">Min severity</label>
  <input id="min_severity" type="number" min="1" max="10" />

  <button id="load">Load events</button>
  <div id="status"></div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([30, 45], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
}).addTo(map);

let markers = L.layerGroup().addTo(map);

const tokenInput = document.getElementById('token');
tokenInput.value = localStorage.getItem('mei_api_token') || '';

function severityColor(severity) {
  if (severity === null || severity === undefined) return '#999999';
  if (severity >= 8) return '#c0392b';
  if (severity >= 5) return '#e67e22';
  return '#2980b9';
}

async function loadEvents() {
  const status = document.getElementById('status');
  const token = tokenInput.value.trim();
  localStorage.setItem('mei_api_token', token);

  const params = new URLSearchParams();
  const since = document.getElementById('since').value;
  const until = document.getElementById('until').value;
  const eventType = document.getElementById('event_type').value.trim();
  const minSeverity = document.getElementById('min_severity').value;
  if (since) params.set('since', new Date(since).toISOString());
  if (until) params.set('until', new Date(until).toISOString());
  if (eventType) params.set('event_type', eventType);
  if (minSeverity) params.set('min_severity', minSeverity);

  status.textContent = 'Loading...';
  try {
    const resp = await fetch(`/api/v1/intelligence/map-events?${params.toString()}`, {
      headers: token ? { Authorization: `Bearer ${token}` } : {},
    });
    if (!resp.ok) {
      status.textContent = `Error ${resp.status}: ${await resp.text()}`;
      return;
    }
    const events = await resp.json();
    markers.clearLayers();
    let pinCount = 0;
    for (const event of events) {
      for (const loc of event.locations) {
        if (loc.latitude === null || loc.longitude === null) continue;
        const marker = L.circleMarker([loc.latitude, loc.longitude], {
          radius: 6 + (event.severity || 0) / 2,
          color: severityColor(event.severity),
          fillColor: severityColor(event.severity),
          fillOpacity: 0.7,
        });
        marker.bindPopup(
          `<strong>${event.title}</strong><br>${event.event_type} — ${new Date(event.started_at).toLocaleDateString()}<br>` +
          `Severity: ${event.severity ?? 'n/a'} | ${event.strategic_significance ?? ''}<br>` +
          `${loc.name}`
        );
        markers.addLayer(marker);
        pinCount += 1;
      }
    }
    status.textContent = `${events.length} events, ${pinCount} pins.`;
  } catch (err) {
    status.textContent = `Request failed: ${err}`;
  }
}

document.getElementById('load').addEventListener('click', loadEvents);
</script>
</body>
</html>
